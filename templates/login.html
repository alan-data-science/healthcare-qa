{% extends "base.html" %}
{% block title %}Login · MediSlot{% endblock %}
{% block content %}
<h1>Sign in</h1>
{% if error %}<p class="alert error">{{ error }}</p>{% endif %}
<form method="post" class="card" novalidate>
  <label>Username
    <input type="text" name="username" id="username" required>
  </label>
  <label>Password
    <input type="password" name="password" id="password" required>
  </label>
  <button type="submit" class="btn">Login</button>
  <p><a href="{{ url_for('forgot_password') }}">Forgot password?</a>
     · <a href="{{ url_for('register') }}">Create patient account</a></p>
</form>
{% endblock %}
