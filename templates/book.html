{% extends "base.html" %}
{% block title %}Book · MediSlot{% endblock %}
{% block content %}
<h1>Book appointment</h1>
{% if message %}<p class="alert ok">{{ message }}</p>{% endif %}
{% if error %}<p class="alert error">{{ error }}</p>{% endif %}
<form method="post" class="card" id="book-form">
  <label>Patient name
    <input type="text" name="patient_name" id="patient_name" value="{{ user.full_name }}">
  </label>
  <label>Age
    <input type="number" name="age" id="age" min="1" max="120">
  </label>
  <label>Phone
    <input type="text" name="phone" id="phone" maxlength="10" value="{{ user.phone }}">
  </label>
  <label>Email
    <input type="email" name="email" id="email" value="{{ user.email }}">
  </label>
  <label>Department
    <select name="department" id="department">
      <option value="">Select</option>
      <option>General Medicine</option>
      <option>Cardiology</option>
      <option>Pediatrics</option>
    </select>
  </label>
  <label>Doctor
    <select name="doctor_id" id="doctor_id">
      <option value="">Select</option>
      {% for d in doctors %}
        <option value="{{ d.id }}">{{ d.name }} ({{ d.department }})</option>
      {% endfor %}
    </select>
  </label>
  <label>Date
    <input type="date" name="date" id="date" min="{{ min_date }}">
  </label>
  <label>Time
    <select name="time" id="time">
      <option value="">Select</option>
      {% for s in slots %}
        <option>{{ s }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Reason for visit
    <textarea name="reason" id="reason" rows="3"></textarea>
  </label>
  <button type="submit" class="btn">Confirm booking</button>
</form>
{% endblock %}
